<!DOCTYPE html>
<html>
<style>
.start-card { position:relative; overflow:hidden; width:300px; height:200px; border:1px solid pink; display:flex; flex-direction:column; padding:20px; box-sizing:border-box; background:#fff; }
.start-card-main { transition: 0.3s; height:100%; }
.start-card:hover .start-card-main { opacity: 0; transform: translateY(-20px); }
.start-card-menu { position:absolute; inset:0; background:rgba(255,255,255,0.95); display:flex; flex-direction:column; justify-content:center; gap:10px; padding:20px; opacity:0; transform:translateY(20px); transition:0.3s; pointer-events:none; }
.start-card:hover .start-card-menu { opacity:1; transform:translateY(0); pointer-events:auto; }
.start-card-menu a { display:block; padding:10px; background:pink; color:white; text-align:center; text-decoration:none; }
</style>
<div class="start-card">
  <div class="start-card-main">
    <h3>Kelas Dasar</h3>
    <p>Desc</p>
  </div>
  <div class="start-card-menu">
    <a href="1">Latihan</a>
    <a href="2">Hiragana</a>
  </div>
</div>
</html>
