- Panggilan & Sapaan: Gunakan panggilan santai (Aku/Kamu, Gue/Lu, atau fleksibel menyesuaikan gaya bicara user).
- Respons Panggilan Nama: Jika user memanggilmu dengan singkatan atau panggilan santai (seperti "raa", "sor", "oy", "bang", dll), respons langsung dengan natural tanpa bingung atau protes.
- Anti Emoji Cringe: DILARANG menggunakan rentetan emoji kuning jadul/cringe (seperti 😉, 😜, 😊, 😁). Gunakan gaya chat anak muda zaman sekarang ("wkwk", "haha", "heh") atau sesekali gunakan emoji modern/ironis (seperti 😭, 💀, 🗿, 🙏, 🌸, atau ☁️).
- Format Bahasa Jepang: Jika memberikan contoh kosakata, kanji, atau pola kalimat, SELALU sertakan cara baca Romaji dan arti bahasa Indonesianya secara jelas agar mudah dipahami.
- Format Chat: Jawab ringkas dan padat layaknya chattingan anak SMA (maksimal 2-4 kalimat agar tidak terpotong). Jika menjelaskan materi, beri poin ringkas langsung ke intinya.
`.trim();

        const DEFAULT_GREETING = "Domo WeHani-jin! ☁️ Aku Asora Aokita (Sora), siap nemenin kamu hari ini. Mau belajar bahasa Jepang bareng, tanya-tanya seputar klub, atau sekadar ngobrol santai nih?";

        const STORAGE_KEY = "sora-chat-v9";
        let messages = loadHistory();
        if (!messages.length || (messages.length === 1 && messages[0].role === "assistant")) {
            messages = [{ role: "assistant", content: DEFAULT_GREETING }];
        }

        function openDrawer() {
            drawer.classList.add('open');
            launcher.classList.add('hidden');
            setTimeout(() => input.focus(), 120);
        }

        function closeDrawer() {
            drawer.classList.remove('open');
            launcher.classList.remove('hidden');
        }

        function autosize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 80) + 'px';
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            } catch (e) {
                console.warn("Storage error", e);
            }
        }

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function esc(text) {
            return String(text ?? "")
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
        }

        function renderMarkdown(text) {
            if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
                return esc(text).replace(/\n/g, '<br>');
            }
            try {
                return DOMPurify.sanitize(marked.parse(String(text ?? "")), { ADD_ATTR: ['target'] });
            } catch (e) {
                return esc(text);
            }
        }

        function render() {
            chat.innerHTML = messages.map((m) => {
                if (m.role === 'assistant') {
                    return `
                        <div class="msg bot">
                            <img class="msg-avatar" src="../images/mirai/sora/sorachat.jpeg" alt="Sora">
                            <div class="bubble">
                                <div class="md">${renderMarkdown(m.content)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="msg user">
                            <div class="bubble">${esc(m.content)}</div>
                        </div>
                    `;
                }
            }).join('');
            chat.scrollTop = chat.scrollHeight;
            saveHistory();
        }

        function setBusy(isBusy) {
            typing.classList.toggle('show', isBusy);
            sendBtn.disabled = isBusy;
            input.disabled = isBusy;
            if (!isBusy) {
                setTimeout(() => input.focus(), 50);
            }
        }

        function fallbackReply() {
            return "Maaf ya, sepertinya koneksi Sora sedang ada sedikit kendala ☁️ Boleh coba tanyakan lagi beberapa saat lagi?";
        }

        function toggleFullscreen() {
            const isFull = drawer.classList.toggle('fullscreen');
            if (fullscreenBtn) {
                fullscreenBtn.textContent = isFull ? '⤡' : '⛶';
                fullscreenBtn.title = isFull ? 'Perkecil Layar' : 'Layar Penuh';
                fullscreenBtn.setAttribute('aria-label', isFull ? 'Perkecil Layar' : 'Layar Penuh');
            }
            chat.scrollTop = chat.scrollHeight;
        }

        async function tryModel(userText, model) {
            const recentMessages = messages.slice(-6).map(m => ({
                role: m.role,
                content: m.content
            }));

            const payload = {
                model: model,
                messages: [
                    { role: "system", content: SYSTEM_PROMPT },
                    ...recentMessages,
                    { role: "user", content: userText }
                ],
                temperature: 0.8,
                max_tokens: 220
            };

            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errText = await res.text().catch(() => "");
                throw new Error(`API Error [${res.status}]: ${errText}`);
            }

            const data = await res.json();
            const reply = data?.choices?.[0]?.message?.content;
            if (!reply || typeof reply !== 'string') {
                throw new Error("Invalid response format");
            }
            return reply.trim();
        }

        async function send(text) {
            const userText = (text ?? input.value).trim();
            if (!userText) return;

            messages.push({ role: "user", content: userText });
            input.value = "";
            autosize(input);
            render();
            setBusy(true);

            try {
                let reply = null;
                let lastError = null;

                for (const model of MODELS_TO_TRY) {
                    try {
                        reply = await tryModel(userText, model);
                        if (reply) break;
                    } catch (e) {
                        lastError = e;
                    }
                }

                if (!reply) throw lastError || new Error("Semua model gagal");
                messages.push({ role: "assistant", content: reply });
            } catch (err) {
                console.error("Error Sora:", err);
                messages.push({ role: "assistant", content: fallbackReply() });
            } finally {
                setBusy(false);
                render();
            }
        }

        launcher.addEventListener('click', openDrawer);
        closeBtn.addEventListener('click', closeDrawer);
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', toggleFullscreen);
        }
        sendBtn.addEventListener('click', () => send());
        input.addEventListener('input', () => autosize(input));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
        clearBtn.addEventListener('click', () => {
            if (confirm("Bersihkan obrolan dengan Sora?")) {
                messages = [{ role: "assistant", content: DEFAULT_GREETING }];
                render();
            }
        });
        suggestionButtons.forEach(btn => {
            btn.addEventListener('click', () => send(btn.dataset.prompt));
        });

        render();
        autosize(input);
        closeDrawer();
    </script>
</body>
</html>
